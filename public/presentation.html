/* Mobile-first presentation refinements */
.proto-bar{display:none!important}
html,body{min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,a,input,select,textarea{touch-action:manipulation}
button,.btn,.nav a{min-height:40px}
input,select,textarea{max-width:100%;font-size:16px}
.table-wrap,.table-scroll,.overflow-x-auto{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{min-width:620px}
.modal-bg{padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.modal{width:min(680px,100%);max-height:calc(100dvh - 24px);overflow:auto}
.install-app{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;border:0;border-radius:999px;padding:12px 18px;background:var(--brand);color:#fff;font-weight:700;box-shadow:0 8px 24px #0003;display:none}
@media(max-width:900px){
.shell{display:flex;flex-direction:column;min-height:100dvh}
.sidebar{position:relative;top:auto;width:100%;height:auto;min-height:0;display:block;padding:10px 12px}
.brand{padding:4px 6px 10px}
.nav{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;white-space:nowrap;padding:2px 0 8px;scrollbar-width:thin}
.nav a{flex:0 0 auto;padding:9px 11px}
.sidebar .foot{display:flex;align-items:center;gap:10px;margin:0;padding:8px 4px 2px;border-top:1px solid #ffffff25}
.sidebar .foot button{margin:0}
.main{width:100%;min-width:0;padding:16px 14px 88px}
.topbar{align-items:flex-start;flex-wrap:wrap}
}
@media(max-width:640px){
body{font-size:14px}
.main{padding:13px 11px 90px}
.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:minmax(0,1fr)}
.card{padding:13px;border-radius:10px}
.stat .value{font-size:23px}
.modal-bg{place-items:end center}
.modal{border-radius:16px 16px 10px 10px;padding:16px}
.modal .foot{flex-wrap:wrap}
.modal .foot button{flex:1 1 auto}
input,select,textarea{width:100%;min-width:0}
}
@media(display-mode:standalone){.install-app{display:none!important}}

/* Presentation header cleanup and logo alignment */
.proto-bar{display:flex!important;justify-content:flex-end;align-items:center;background:transparent!important;border:0!important;padding:0!important;margin:0 0 12px!important;min-height:0}
.proto-bar>span{display:none!important}
.proto-bar button{margin-left:auto}
.livya-brand-logo{display:block;width:48px;height:48px;object-fit:contain;flex:0 0 48px;border-radius:10px}
.brand{display:flex;align-items:center;gap:12px;min-height:56px}
.brand>small{display:block;max-width:150px;line-height:1.35;font-size:11px;opacity:.8}
@media(max-width:900px){.livya-brand-logo{width:38px;height:38px;flex-basis:38px}.brand{min-height:44px}}
