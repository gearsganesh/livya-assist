<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#a71928">
  <title>LIVYA | Patient Coordination & Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/ui-fixes.css">
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center;background:#f4f1ef;font-family:Inter,Segoe UI,Arial,sans-serif">
      <div style="background:#fff;padding:34px;border:1px solid #e2dedb;border-radius:12px;box-shadow:0 10px 35px #0001;width:min(420px,calc(100% - 30px));text-align:center">
        <h1 style="margin:0 0 8px;color:#980d17">LIVYA</h1>
        <p style="margin:0;color:#777">Starting Patient Coordination & Concierge...</p>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script>
    (function(){
      function showError(message){
        var app=document.getElementById('app');
        if(!app)return;
        app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#f4f1ef;font-family:Inter,Segoe UI,Arial,sans-serif"><div style="background:#fff;padding:34px;border:1px solid #e2dedb;border-radius:12px;box-shadow:0 10px 35px #0001;width:min(520px,calc(100% - 30px))"><h2 style="margin:0 0 10px;color:#980d17">LIVYA could not start</h2><p style="color:#555">The application JavaScript reported an error.</p><pre style="white-space:pre-wrap;background:#f7f7f6;padding:12px;border-radius:6px;color:#333;font-size:12px">'+String(message||'Unknown error').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre><p style="font-size:12px;color:#888">Refresh this page after the deployment finishes.</p></div></div>';
      }
      window.addEventListener('error',function(e){showError(e.error?.stack||e.message||'Script error')});
      window.addEventListener('unhandledrejection',function(e){showError(e.reason?.stack||e.reason?.message||String(e.reason||'Unhandled promise rejection'))});
    })();
  </script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
